# Static origin for spacescience.tech.
#
# Deliberately its own container rather than a route bolted onto an existing
# service: a 10 MB page has no business being served out of somebody else's
# app process, and a bad deploy here cannot take anything else down.
#
# Runs rootless and read-only, so every path nginx writes to has to be
# somewhere it actually can: pid and temp paths all live under /tmp.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    log_format spacescience '$remote_addr - [$time_local] "$request" '
                            '$status $body_bytes_sent rt=$request_time';
    access_log /dev/stdout spacescience;

    # cloudflared sits on the private container network; only trust the real
    # client address when it comes from there.
    set_real_ip_from 10.89.0.0/24;
    real_ip_header CF-Connecting-IP;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    server_tokens off;

    # The page is ~10 MB and almost all of it is base64 audio. Compressing
    # that per request would burn CPU for a modest win, so the deploy script
    # ships a pre-built .gz alongside and nginx just hands it over.
    gzip off;
    gzip_static on;

    server {
        listen 8080;
        server_name _;
        root /srv/site;

        # Emit "Location: /" rather than an absolute URL built from the
        # internal listener, which would leak 127.0.0.1:8080 to the client.
        absolute_redirect off;
        port_in_redirect off;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = / {
            # Deliberately NOT =404 here. If the page were missing, a 404 would
            # be sent to @home, which redirects to / -- straight into a redirect
            # loop. A missing page is a server fault, so say so.
            try_files /index.html =503;
            add_header Cache-Control "public, max-age=300" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Spacescience-Runtime "podman" always;
        }

        # One page, one path. Anything else goes home, matching how the other
        # parked apexes on this host behave.
        location / {
            add_header Cache-Control "no-store" always;
            return 302 /;
        }

        # Belt and braces: anything that still manages to produce an error
        # status goes home too, so a visitor never sees an nginx error page.
        # The catch-all above already handles unknown paths; this covers the
        # rest (denied, wrong method, oversized URI).
        error_page 403 404 405 414 = @home;

        location @home {
            add_header Cache-Control "no-store" always;
            return 302 /;
        }
    }
}
